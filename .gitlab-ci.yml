stages:
  - build-and-publish

variables:
  GIT_LFS_SKIP_SMUDGE: "0"
  GIT_SUBMODULE_STRATEGY: normal
  DOCKERHUB_IMAGE: "yjbeetle/dockersw-complete"

build_and_push_image:
  stage: build-and-publish
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"https://index.docker.io/v1/\":{\"auth\":\"$(printf "%s:%s" "${DOCKERHUB_USERNAME}" "${DOCKERHUB_PASSWORD}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
  script:
    - SUBMODULE_HASH=$(head -c 7 .git/modules/DockerSW/HEAD 2>/dev/null || true)
    - echo "检测到子模块 Hash: ${SUBMODULE_HASH}"
    - DEST_ARGS="--destination ${DOCKERHUB_IMAGE}:latest"
    - if [ -n "${SUBMODULE_HASH}" ]; then DEST_ARGS="${DEST_ARGS} --destination ${DOCKERHUB_IMAGE}:sha-${SUBMODULE_HASH}"; fi
    - echo "开始执行 Kaniko 无特权用户态构建并发布..."
    - >-
      /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
      ${DEST_ARGS}
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
