stages:
  - complete

variables:
  # 旧的 7GB 安装目录已从当前版本移除；这里只拉取仍需内置的 FlexNet 小文件。
  GIT_LFS_SKIP_SMUDGE: "0"
  GIT_SUBMODULE_STRATEGY: recursive
  # 私有仓库固定的内网安装介质；项目级 CI 变量仍可覆盖这两个值。
  SW_MEDIA_URL: "https://share.local.yjbeetle.art/d/Resources/Software/Media/SolidWorks/2025/DS.SolidWorks.2025.SP5.0.Premium-SSQ/SolidWorks.2025.SP5.0.Premium.DVD.iso?sign=Le9UbhSBp9n9gryVhoDYosgg_YluaI4XHuh_b7swMMA=:0"
  SW_MEDIA_SHA256: "3ceb42726498416941fbadb9a74623198cd835335c0c1f9c86dfcf89ede6744a"

.kaniko:
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  before_script:
    - sh scripts/configure_kaniko_registry.sh
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

build_dockersw_complete:
  extends: .kaniko
  stage: complete
  timeout: 3h
  script:
    - sh scripts/fetch_sw_media.sh
    - sh scripts/kaniko_build.sh
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $SW_MEDIA_SHA256 && ($SW_MEDIA_URL || $SW_MEDIA_LOCAL_PATH)'
    - if: '$CI_COMMIT_TAG && $SW_MEDIA_SHA256 && ($SW_MEDIA_URL || $SW_MEDIA_LOCAL_PATH)'
    - when: manual
      allow_failure: true
