stages:
  - build-and-publish

variables:
  # 目标 Docker Hub 镜像名称（支持用户在 CI/CD Variables 覆盖，默认 yjbeetle/dockersw-complete）
  DOCKER_IMAGE_NAME: ${DOCKERHUB_IMAGE:-"yjbeetle/dockersw-complete"}
  DOCKER_IMAGE_TAG: ${CI_COMMIT_TAG:-"latest"}
  GIT_LFS_SKIP_SMUDGE: "0"

build_and_push_image:
  stage: build-and-publish
  image: docker:24-cli
  before_script:
    - |
      if [ -z "${DOCKERHUB_USERNAME:-}" ] || [ -z "${DOCKERHUB_PASSWORD:-}" ]; then
        echo "=================================================================================="
        echo " [ERROR] 未检测到 Docker Hub 凭据环境变量！"
        echo " 请在 GitLab 项目的 Settings -> CI/CD -> Variables 中配置以下变量："
        echo "   - DOCKERHUB_USERNAME: 你的 Docker Hub 用户名"
        echo "   - DOCKERHUB_PASSWORD: 你的 Docker Hub Access Token 或密码"
        echo "   - DOCKERHUB_IMAGE (可选): 镜像名，默认为 yjbeetle/dockersw-complete"
        echo "=================================================================================="
        exit 1
      fi
    - echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
  script:
    - echo "正在构建一体化 SolidWorks 容器镜像: ${DOCKER_IMAGE_NAME}:${DOCKER_IMAGE_TAG}..."
    - docker build -t "${DOCKER_IMAGE_NAME}:${DOCKER_IMAGE_TAG}" .
    - echo "正在推送至 Docker Hub: ${DOCKER_IMAGE_NAME}:${DOCKER_IMAGE_TAG}..."
    - docker push "${DOCKER_IMAGE_NAME}:${DOCKER_IMAGE_TAG}"
    - echo "Docker 镜像成功构建并发布至 Docker Hub: ${DOCKER_IMAGE_NAME}:${DOCKER_IMAGE_TAG}！"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
