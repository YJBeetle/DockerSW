# DockerSW GitLab CI 无头批量导出示例
#
# SW_PREINSTALLED_IMAGE 指向由可信私有流水线构建的镜像。该镜像应已通过
# sw-install --accept-eula 安装 SOLIDWORKS；公开 sw-runtime 不能直接导出。
# SW_LICENSE_SERVER 应在 GitLab 项目中配置为 masked/protected CI/CD Variable。

stages:
  - export

variables:
  SW_PREINSTALLED_IMAGE: registry.internal.mycompany.com/cad/sw-preinstalled:latest

export_cad_assets:
  stage: export
  image: "$SW_PREINSTALLED_IMAGE"
  script:
    - echo "=== 使用私有预安装镜像执行 SOLIDWORKS 导出 ==="
    - mkdir -p ./dist
    - >
      sw-export
      --list ./export_list.txt
      --workspace "$CI_PROJECT_DIR"
      --outdir ./dist
  artifacts:
    name: "CAD_Exports_${CI_COMMIT_REF_NAME}_${CI_COMMIT_SHORT_SHA}"
    when: on_success
    expire_in: 1 week
    paths:
      - ./dist/
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
