# DockerSW 私有预安装镜像运行示例
#
# SW_IMAGE 必须指向已通过 sw-install 安装好 SOLIDWORKS 的私有镜像。
# 推荐通过 SW_LICENSE_SERVER 使用局域网中的浮动许可服务器。

services:
  sw-exporter:
    image: "${SW_IMAGE:?set SW_IMAGE to a private sw-preinstalled image}"
    environment:
      SW_LICENSE_SERVER: "${SW_LICENSE_SERVER:-}"
      START_LOCAL_LICENSE: "${START_LOCAL_LICENSE:-false}"
      SW_INSTALL_DIR: /opt/solidworks
      FLEXNET_DIR: /opt/SolidWorks_Flexnet_Server
    volumes:
      - "${CAD_WORKSPACE:-..}:/workspace:ro"
      - "${EXPORT_OUTPUT:-./dist_output}:/output"
      # 可选本地 lmgrd 模式：取消下一行注释，并设置 FLEXNET_HOST_DIR。
      # - "${FLEXNET_HOST_DIR:?set FLEXNET_HOST_DIR}:/opt/SolidWorks_Flexnet_Server:ro"
    working_dir: /workspace
    command: >
      sw-export
      --list /workspace/examples/export-list-demo.txt
      --workspace /workspace
      --outdir /output
