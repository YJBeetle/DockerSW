name: Build sw-preinstalled from ISO

on:
  workflow_run:
    workflows: ["Build sw-runtime"]
    types:
      - completed
    branches:
      - main
      - '20[0-9][0-9]'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: sw-preinstalled-build
  cancel-in-progress: false

jobs:
  build-vanilla:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    env:
      RCLONE_CONFIG_FILE: /tmp/rclone-${{ github.run_id }}-${{ github.run_attempt }}.conf
      GDRIVE_MOUNT: /mnt/gdrive
      SW_MEDIA_MOUNT: preinstall/media
      SW_MEDIA_PATH: Share/Software/DS.SolidWorks.2025.SP5.0.Premium-SSQ/SolidWorks.2025.SP5.0.Premium.DVD.iso
      SW_IMAGE: ghcr.io/yjbeetle/sw-preinstalled
    steps:
      - name: Free runner disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          swap-storage: true

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve image names
        shell: bash
        run: |
          set -Eeuo pipefail
          commit_sha="$(git rev-parse --short=7 HEAD)"
          echo "SW_RUNTIME_IMAGE=ghcr.io/yjbeetle/sw-runtime:sha-${commit_sha}" >> "${GITHUB_ENV}"
          echo "SW_IMAGE_SHA_TAG=sha-${commit_sha}" >> "${GITHUB_ENV}"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install rclone and FUSE
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fuse3 \
            ca-certificates \
            curl \
            unzip
          curl -fsSL https://rclone.org/install.sh | sudo bash
          echo "user_allow_other" | sudo tee -a /etc/fuse.conf >/dev/null

      - name: Prepare Google Drive configuration
        shell: bash
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
        run: |
          set -Eeuo pipefail
          test -n "${RCLONE_CONFIG_B64}" || {
            echo "Missing secret: RCLONE_CONFIG_B64" >&2
            exit 1
          }

          install -m 0600 /dev/null "${RCLONE_CONFIG_FILE}"
          echo "${RCLONE_CONFIG_B64}" | base64 -d > "${RCLONE_CONFIG_FILE}"
          rclone --config "${RCLONE_CONFIG_FILE}" listremotes | grep -qx 'gdrive:'

      - name: Mount Google Drive and the SOLIDWORKS ISO
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo mkdir -p "${GDRIVE_MOUNT}" "${SW_MEDIA_MOUNT}"
          sudo chown "${USER}:${USER}" "${GDRIVE_MOUNT}" "${SW_MEDIA_MOUNT}"

          rclone mount gdrive: "${GDRIVE_MOUNT}" \
            --config "${RCLONE_CONFIG_FILE}" \
            --allow-other \
            --read-only \
            --vfs-cache-mode full \
            --vfs-cache-max-age 24h \
            --vfs-read-ahead 256M \
            --buffer-size 64M \
            --dir-cache-time 72h \
            --log-file "${RUNNER_TEMP}/rclone-gdrive.log" \
            --log-level INFO &

          mounted=false
          for _ in $(seq 1 60); do
            if findmnt --target "${GDRIVE_MOUNT}" >/dev/null 2>&1; then
              mounted=true
              break
            fi
            sleep 1
          done
          "${mounted}"

          iso_path="${GDRIVE_MOUNT}/${SW_MEDIA_PATH}"
          test -f "${iso_path}" || {
            echo "ISO not found: ${SW_MEDIA_PATH}" >&2
            exit 1
          }
          sudo mount -o loop,ro "${iso_path}" "${SW_MEDIA_MOUNT}"
          test -s "${SW_MEDIA_MOUNT}/swwi/data/solidworks.msi"

          df -h /
          findmnt --target "${GDRIVE_MOUNT}"
          findmnt --target "${SW_MEDIA_MOUNT}"

      - name: Build vanilla preinstalled image
        shell: bash
        run: |
          set -Eeuo pipefail
          docker pull "${SW_RUNTIME_IMAGE}"
          docker build \
            --build-arg "BASE_IMAGE=${SW_RUNTIME_IMAGE}" \
            -f preinstall/Dockerfile \
            -t "${SW_IMAGE}:${SW_IMAGE_SHA_TAG}" \
            preinstall

      - name: Publish candidate vanilla image to GHCR
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "[CI push] Publishing candidate vanilla image: ${SW_IMAGE}:${SW_IMAGE_SHA_TAG}..."
          docker push "${SW_IMAGE}:${SW_IMAGE_SHA_TAG}"

      - name: Show storage usage
        if: always()
        shell: bash
        run: |
          df -h / || true
          docker system df || true

      - name: Unmount installation media
        if: always()
        shell: bash
        run: |
          sudo umount "${SW_MEDIA_MOUNT}" 2>/dev/null || true
          fusermount3 -u "${GDRIVE_MOUNT}" 2>/dev/null || \
            sudo umount "${GDRIVE_MOUNT}" 2>/dev/null || true
          tail -n 100 "${RUNNER_TEMP}/rclone-gdrive.log" 2>/dev/null || true
          rm -f "${RCLONE_CONFIG_FILE}"

      - name: Upload private installer logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: sw-install-logs-${{ github.run_id }}
          path: ${{ runner.temp }}/sw-install-logs
          if-no-files-found: ignore
          retention-days: 14
