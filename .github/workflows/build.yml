name: Build & Verify SolidWorks Images

on:
  push:
    branches:
      - main
      - '20[0-9][0-9]'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force full rebuild even if image for this commit SHA exists on GHCR'
        type: boolean
        default: false
      media_path:
        description: 'Path to the ISO inside the Google Drive remote'
        type: string
        default: 'Share/Software/DS.SolidWorks.2025.SP5.0.Premium-SSQ/SolidWorks.2025.SP5.0.Premium.DVD.iso'
      assets_path:
        description: 'Path to activation crack assets inside the Google Drive remote'
        type: string
        default: 'Share/Software/DS.SolidWorks.2025.SP5.0.Premium-SSQ/crack'
      languages:
        description: 'Localized image tags to build (comma-separated or all)'
        type: string
        default: 'zh-cn'

permissions:
  contents: read
  packages: write

concurrency:
  # 各 package 内的默认镜像与 CLI 变体分别使用独立 GHCR buildcache 标签；
  # 串行执行可避免连续 push 各自重跑安装链，并防止并发覆盖缓存索引。
  group: dockersw-image-pipeline
  cancel-in-progress: false

jobs:
  unit-tests:
    name: Run Python Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Validate Shell Scripts
        run: |
          bash -n runtime/init_wineprefix.sh
          bash -n runtime/entrypoint.sh
          bash -n swcli/entrypoint-cli.sh
          bash -n runtime/fetch_managed_com.sh
          bash -n runtime/prepare_managed_com.sh
          bash -n runtime/bin/*
          bash -n swcli/bin/*
          bash -n smoke-test/export.sh
          bash -n smoke-test/verify-swcli.sh
          bash -n smoke-test/export-localized.sh
          perl -c runtime/patch_win32u.pl
          perl -c runtime/patch_wine_mono.pl

      - name: Run Logic Tests
        run: |
          python -m unittest discover -s runtime/tests -p "test_*.py" -v
          python -m unittest discover -s swcli/tests -p "test_*.py" -v
          PYTHONPATH=swcli/SWCLI/src python -m unittest discover -s swcli/SWCLI/tests -p "test_*.py" -v

  build-and-smoke-test:
    name: Build & Verify SolidWorks Images
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      RCLONE_CONFIG_FILE: /tmp/rclone-${{ github.run_id }}-${{ github.run_attempt }}.conf
      GDRIVE_MOUNT: /mnt/gdrive
      SW_MEDIA_MOUNT: preinstall/media
      SW_MEDIA_PATH: ${{ inputs.media_path || 'Share/Software/DS.SolidWorks.2025.SP5.0.Premium-SSQ/SolidWorks.2025.SP5.0.Premium.DVD.iso' }}
      SW_ASSETS_PATH: ${{ inputs.assets_path || 'Share/Software/DS.SolidWorks.2025.SP5.0.Premium-SSQ/crack' }}
      SW_RUNTIME_REPO: ghcr.io/yjbeetle/sw-runtime
      SW_PREINSTALLED_REPO: ghcr.io/yjbeetle/sw-preinstalled
      SW_EXECUTABLE_REPO: ghcr.io/yjbeetle/sw-executable
      SW_LANGUAGES: ${{ inputs.languages || 'zh-cn' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Resolve image names
        shell: bash
        run: |
          set -Eeuo pipefail
          commit_sha="$(git rev-parse --short=7 HEAD)"
          echo "SW_IMAGE_SHA_TAG=sha-${commit_sha}" >> "${GITHUB_ENV}"
          echo "SW_RUNTIME_IMAGE=${SW_RUNTIME_REPO}:sha-${commit_sha}" >> "${GITHUB_ENV}"
          echo "SW_RUNTIME_PAYLOAD_IMAGE=${SW_RUNTIME_REPO}:sha-${commit_sha}-payload" >> "${GITHUB_ENV}"
          echo "SW_PREINSTALLED_IMAGE=${SW_PREINSTALLED_REPO}:sha-${commit_sha}" >> "${GITHUB_ENV}"
          echo "SW_RUNTIME_CLI_IMAGE=${SW_RUNTIME_REPO}:sha-${commit_sha}-cli" >> "${GITHUB_ENV}"
          echo "SW_PREINSTALLED_CLI_IMAGE=${SW_PREINSTALLED_REPO}:sha-${commit_sha}-cli" >> "${GITHUB_ENV}"
          echo "SW_EXECUTABLE_IMAGE=${SW_EXECUTABLE_REPO}:sha-${commit_sha}" >> "${GITHUB_ENV}"
          echo "SW_EXECUTABLE_CLI_IMAGE=${SW_EXECUTABLE_REPO}:sha-${commit_sha}-cli" >> "${GITHUB_ENV}"

          language_plan="${RUNNER_TEMP}/solidworks-languages.tsv"
          : > "${language_plan}"
          if [ "${SW_LANGUAGES}" = "all" ]; then
            grep -v '^#' preinstall/languages.tsv > "${language_plan}"
          else
            printf '%s\n' "${SW_LANGUAGES}" \
              | tr ',' '\n' \
              | while IFS= read -r requested_language; do
                  requested_language="$(printf '%s' "${requested_language}" | xargs)"
                  [ -n "${requested_language}" ] || continue
                  language_row="$(awk -F '\t' -v tag="${requested_language}" \
                    '$1 == tag { print; exit }' preinstall/languages.tsv)"
                  [ -n "${language_row}" ] || {
                    echo "Unsupported SOLIDWORKS language tag: ${requested_language}" >&2
                    echo "Supported tags: $(grep -v '^#' preinstall/languages.tsv | cut -f1 | paste -sd, -)" >&2
                    exit 1
                  }
                  printf '%s\n' "${language_row}"
                done \
              | awk -F '\t' '!seen[$1]++' > "${language_plan}"
          fi
          test -s "${language_plan}" || {
            echo "At least one SOLIDWORKS language must be selected." >&2
            exit 1
          }
          echo "SW_LANGUAGE_PLAN=${language_plan}" >> "${GITHUB_ENV}"
          echo "[CI language] Requested localized images: $(cut -f1 "${language_plan}" | paste -sd, -)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if runtime images already exist on GHCR
        id: check-runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          force="${{ inputs.force_rebuild || 'false' }}"

          if [ "${force}" != "true" ] && \
             docker manifest inspect "${SW_RUNTIME_IMAGE}" >/dev/null 2>&1 && \
             docker manifest inspect "${SW_RUNTIME_PAYLOAD_IMAGE}" >/dev/null 2>&1 && \
             docker manifest inspect "${SW_RUNTIME_CLI_IMAGE}" >/dev/null 2>&1; then
            echo "[CI fast-path] runtime、SWCLI payload 与 runtime CLI 镜像均已存在，跳过重复构建。"
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "[CI] runtime 镜像不存在或要求强制重构，继续执行构建流程..."
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Build and load sw-runtime image
        if: steps.check-runtime.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: runtime/Dockerfile
          target: sw-runtime
          load: true
          tags: |
            sw-runtime:local-test
            ${{ env.SW_RUNTIME_IMAGE }}
          cache-from: type=registry,ref=ghcr.io/yjbeetle/sw-runtime:buildcache-image
          cache-to: type=registry,ref=ghcr.io/yjbeetle/sw-runtime:buildcache-image,mode=max,ignore-error=true

      - name: Smoke test sw-runtime image
        if: steps.check-runtime.outputs.exists != 'true'
        run: |
          echo "[CI] 验证 0: 默认镜像不包含 SWCLI，且安装器可用..."
          docker run --rm --entrypoint bash sw-runtime:local-test -lc \
            'test ! -e /opt/swcli && sw-install --help >/dev/null'

          echo "[CI] 验证 1: 测试固定 Wine 版本与 Windows 虚拟版本..."
          test "$(docker run --rm --entrypoint wine sw-runtime:local-test --version)" = "wine-11.16"
          docker run --rm sw-runtime:local-test wine cmd /c ver

          echo "[CI] 验证 2: 测试 Wine-Mono stdcall 与托管 COM 注册组件..."
          docker run --rm sw-runtime:local-test /usr/local/lib/sw-runtime/prepare_managed_com.sh

          echo "[CI] 验证 3: 测试 Windows Python 3.11 与 pywin32 COM 模块就绪..."
          docker run --rm sw-runtime:local-test wine "C:\\Python311\\python.exe" -c "import win32com.client, pythoncom; print('[HEALTH CHECK OK] Windows Python & pywin32 ready')"

          echo "[CI] 验证 4: 检查 Wine OpenGL 24-bit DIB 补丁已应用..."
          docker run --rm sw-runtime:local-test perl /usr/local/lib/sw-runtime/patch_win32u.pl

      - name: Push verified sw-runtime image
        if: steps.check-runtime.outputs.exists != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "[CI] runtime 验证通过，推送至 GHCR 供后续构建与复现..."
          docker push "${SW_RUNTIME_IMAGE}"

      - name: Build and push SWCLI payload image
        if: steps.check-runtime.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: swcli/Dockerfile
          target: swcli-payload
          push: true
          tags: ${{ env.SW_RUNTIME_PAYLOAD_IMAGE }}
          cache-from: type=registry,ref=ghcr.io/yjbeetle/sw-runtime:buildcache-payload
          cache-to: type=registry,ref=ghcr.io/yjbeetle/sw-runtime:buildcache-payload,mode=max,ignore-error=true

      - name: Build and load sw-runtime CLI image
        if: steps.check-runtime.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: swcli/Dockerfile.delivery
          target: swcli-delivery
          build-args: |
            IMAGE=${{ env.SW_RUNTIME_IMAGE }}
            PAYLOAD_IMAGE=${{ env.SW_RUNTIME_PAYLOAD_IMAGE }}
          load: true
          tags: |
            sw-runtime-cli:local-test
            ${{ env.SW_RUNTIME_CLI_IMAGE }}
          # 用 GHCR 上的专用 buildcache 标签替代 GHA 缓存：镜像本就推送到同一仓库，
          # registry 缓存可与已存在的 blob 去重，避免 GHA 缓存每次上传数 GB（约 195s）。
          cache-from: type=registry,ref=ghcr.io/yjbeetle/sw-runtime:buildcache-cli
          cache-to: type=registry,ref=ghcr.io/yjbeetle/sw-runtime:buildcache-cli,mode=max,ignore-error=true

      - name: Smoke test sw-runtime CLI image
        if: steps.check-runtime.outputs.exists != 'true'
        run: |
          echo "[CI] 验证 CLI 镜像中的 Linux Python 客户端与 Wine daemon 命令行..."
          docker run --rm sw-runtime-cli:local-test sw-cli version --json
          docker run --rm sw-runtime-cli:local-test sw-cli daemon --help

          echo "[CI] 验证 CLI 镜像保留默认镜像中的安装器命令..."
          docker run --rm sw-runtime-cli:local-test sw-install --help

      - name: Push verified sw-runtime CLI image
        if: steps.check-runtime.outputs.exists != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "[CI] CLI 镜像验证通过，推送至 GHCR..."
          docker push "${SW_RUNTIME_CLI_IMAGE}"

      - name: Check if images are already verified and built for this commit
        id: check-images
        shell: bash
        run: |
          set -Eeuo pipefail
          force="${{ inputs.force_rebuild || 'false' }}"
          target_tag="${{ github.ref_name }}"

          all_images_exist=true
          for image in \
            "${SW_PREINSTALLED_IMAGE}" \
            "${SW_PREINSTALLED_CLI_IMAGE}" \
            "${SW_EXECUTABLE_IMAGE}" \
            "${SW_EXECUTABLE_CLI_IMAGE}"; do
            docker manifest inspect "${image}" >/dev/null 2>&1 \
              || all_images_exist=false
          done
          while IFS=$'\t' read -r language_tag _; do
            for repository in "${SW_PREINSTALLED_REPO}" "${SW_EXECUTABLE_REPO}"; do
              docker manifest inspect "${repository}:${SW_IMAGE_SHA_TAG}-${language_tag}" >/dev/null 2>&1 \
                || all_images_exist=false
              docker manifest inspect "${repository}:${SW_IMAGE_SHA_TAG}-${language_tag}-cli" >/dev/null 2>&1 \
                || all_images_exist=false
            done
          done < "${SW_LANGUAGE_PLAN}"

          if [ "${force}" != "true" ] && [ "${all_images_exist}" = "true" ]; then
            echo "[CI fast-path] 检测到当前提交 (${SW_IMAGE_SHA_TAG}) 的英文及本地化镜像均已完成验证！"
            echo "[CI fast-path] 跳过 30+ 分钟的 ISO 挂载、预安装与冒烟测试，秒级晋升标签..."

            if [ -n "${target_tag}" ]; then
              promote_image() {
                local source_image="$1"
                local branch_tag="$2"
                local latest_tag="$3"
                local -a tags=(--tag "${branch_tag}")
                if [ "${target_tag}" = "main" ]; then
                  tags+=(--tag "${latest_tag}")
                fi
                docker buildx imagetools create --prefer-index=false \
                  "${tags[@]}" "${source_image}"
              }

              echo "[CI fast-path] 晋升分支标签: ${target_tag}..."
              promote_image "${SW_RUNTIME_IMAGE}" \
                "${SW_RUNTIME_REPO}:${target_tag}" "${SW_RUNTIME_REPO}:latest"
              promote_image "${SW_RUNTIME_CLI_IMAGE}" \
                "${SW_RUNTIME_REPO}:${target_tag}-cli" "${SW_RUNTIME_REPO}:latest-cli"
              promote_image "${SW_PREINSTALLED_IMAGE}" \
                "${SW_PREINSTALLED_REPO}:${target_tag}" "${SW_PREINSTALLED_REPO}:latest"
              promote_image "${SW_PREINSTALLED_CLI_IMAGE}" \
                "${SW_PREINSTALLED_REPO}:${target_tag}-cli" "${SW_PREINSTALLED_REPO}:latest-cli"
              promote_image "${SW_EXECUTABLE_IMAGE}" \
                "${SW_EXECUTABLE_REPO}:${target_tag}" "${SW_EXECUTABLE_REPO}:latest"
              promote_image "${SW_EXECUTABLE_CLI_IMAGE}" \
                "${SW_EXECUTABLE_REPO}:${target_tag}-cli" "${SW_EXECUTABLE_REPO}:latest-cli"
              while IFS=$'\t' read -r language_tag _; do
                promote_image \
                  "${SW_PREINSTALLED_REPO}:${SW_IMAGE_SHA_TAG}-${language_tag}" \
                  "${SW_PREINSTALLED_REPO}:${target_tag}-${language_tag}" \
                  "${SW_PREINSTALLED_REPO}:latest-${language_tag}"
                promote_image \
                  "${SW_PREINSTALLED_REPO}:${SW_IMAGE_SHA_TAG}-${language_tag}-cli" \
                  "${SW_PREINSTALLED_REPO}:${target_tag}-${language_tag}-cli" \
                  "${SW_PREINSTALLED_REPO}:latest-${language_tag}-cli"
                promote_image \
                  "${SW_EXECUTABLE_REPO}:${SW_IMAGE_SHA_TAG}-${language_tag}" \
                  "${SW_EXECUTABLE_REPO}:${target_tag}-${language_tag}" \
                  "${SW_EXECUTABLE_REPO}:latest-${language_tag}"
                promote_image \
                  "${SW_EXECUTABLE_REPO}:${SW_IMAGE_SHA_TAG}-${language_tag}-cli" \
                  "${SW_EXECUTABLE_REPO}:${target_tag}-${language_tag}-cli" \
                  "${SW_EXECUTABLE_REPO}:latest-${language_tag}-cli"
              done < "${SW_LANGUAGE_PLAN}"
            fi

            echo "already_verified=true" >> "${GITHUB_OUTPUT}"
          else
            echo "[CI] 镜像未验证或需要全量重构，继续执行预装与冒烟测试..."
            echo "already_verified=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Resolve reusable SOLIDWORKS installation image
        id: check-installed
        if: steps.check-images.outputs.already_verified != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          force="${{ inputs.force_rebuild || 'false' }}"

          # The installation ISO is an immutable input. Reuse the installed image
          # whenever the runtime image, installation recipe and configured media
          # identity are unchanged; do not mount or scan the ISO merely to ask
          # BuildKit whether its RUN layer is cached.
          runtime_digest="$(
            docker buildx imagetools inspect "${SW_RUNTIME_IMAGE}" \
              --format '{{json .Manifest}}' | jq -r '.digest'
          )"
          [[ "${runtime_digest}" == sha256:* ]] || {
            echo "Unable to resolve runtime image digest: ${runtime_digest}" >&2
            exit 1
          }
          recipe_digest="$(sha256sum preinstall/Dockerfile | cut -d' ' -f1)"
          install_key="$(
            printf '%s\n%s\n%s\n' \
              "${runtime_digest}" \
              "${recipe_digest}" \
              "${SW_MEDIA_PATH}" | sha256sum | cut -d' ' -f1
          )"
          reusable_image="${SW_PREINSTALLED_REPO}:install-${install_key:0:32}"

          echo "SW_PREINSTALLED_REUSABLE_IMAGE=${reusable_image}" >> "${GITHUB_ENV}"
          echo "[CI cache] SOLIDWORKS installation identity: install-${install_key:0:32}"

          if [ "${force}" != "true" ] && \
             docker manifest inspect "${reusable_image}" >/dev/null 2>&1; then
            echo "[CI cache] Reusing installed SOLIDWORKS image; ISO access is unnecessary."
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "[CI cache] Installed image is missing or rebuild was forced; ISO access is required."
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

          language_recipe_digest="$(sha256sum preinstall/Dockerfile.language | cut -d' ' -f1)"
          language_build_plan="${RUNNER_TEMP}/solidworks-language-builds.tsv"
          : > "${language_build_plan}"
          language_media_required=false
          while IFS=$'\t' read -r \
            language_tag media_directory language_msi language_id \
            posix_locale solidworks_language; do
            language_key="$(
              printf '%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n' \
                "${install_key}" \
                "${language_recipe_digest}" \
                "${SW_MEDIA_PATH}" \
                "${language_tag}" \
                "${media_directory}" \
                "${language_msi}" \
                "${posix_locale}" \
                "${solidworks_language}" | sha256sum | cut -d' ' -f1
            )"
            language_reusable_image="${SW_PREINSTALLED_REPO}:install-${language_key:0:32}-${language_tag}"
            language_cached=false
            if [ "${force}" != "true" ] && \
               docker manifest inspect "${language_reusable_image}" >/dev/null 2>&1; then
              language_cached=true
              echo "[CI cache] Reusing ${language_tag} SOLIDWORKS language image."
            else
              language_media_required=true
              echo "[CI cache] ${language_tag} language image is missing or rebuild was forced."
            fi
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
              "${language_tag}" \
              "${media_directory}" \
              "${language_msi}" \
              "${language_id}" \
              "${posix_locale}" \
              "${solidworks_language}" \
              "${language_reusable_image}" \
              "${language_cached}" >> "${language_build_plan}"
          done < "${SW_LANGUAGE_PLAN}"
          echo "SW_LANGUAGE_BUILD_PLAN=${language_build_plan}" >> "${GITHUB_ENV}"
          echo "language_media_required=${language_media_required}" >> "${GITHUB_OUTPUT}"

      - name: Inspect runner disk capacity
        id: runner-disk
        if: steps.check-images.outputs.already_verified != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          required_kib=$((50 * 1024 * 1024))
          available_kib="$(df --output=avail -k / | tail -n 1 | tr -d ' ')"
          df -h /
          if [ "${available_kib}" -lt "${required_kib}" ]; then
            echo "cleanup_required=true" >> "${GITHUB_OUTPUT}"
          else
            echo "cleanup_required=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Reclaim runner disk space when required
        if: >-
          steps.check-images.outputs.already_verified != 'true' &&
          steps.runner-disk.outputs.cleanup_required == 'true'
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          swap-storage: true

      - name: Verify runner disk capacity
        if: steps.check-images.outputs.already_verified != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          required_kib=$((50 * 1024 * 1024))
          available_kib="$(df --output=avail -k / | tail -n 1 | tr -d ' ')"
          df -h /
          if [ "${available_kib}" -lt "${required_kib}" ]; then
            available_gib="$((available_kib / 1024 / 1024))"
            echo "Runner disk is too small after cleanup: ${available_gib} GiB available; at least 50 GiB is required." >&2
            exit 1
          fi

      - name: Install rclone and FUSE
        if: steps.check-images.outputs.already_verified != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fuse3 \
            ca-certificates \
            curl \
            unzip
          curl -fsSL https://rclone.org/install.sh | sudo bash
          echo "user_allow_other" | sudo tee -a /etc/fuse.conf >/dev/null

      - name: Prepare Google Drive configuration
        if: steps.check-images.outputs.already_verified != 'true'
        shell: bash
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
        run: |
          set -Eeuo pipefail
          test -n "${RCLONE_CONFIG_B64}" || {
            echo "Missing secret: RCLONE_CONFIG_B64" >&2
            exit 1
          }

          install -m 0600 /dev/null "${RCLONE_CONFIG_FILE}"
          echo "${RCLONE_CONFIG_B64}" | base64 -d > "${RCLONE_CONFIG_FILE}"
          rclone --config "${RCLONE_CONFIG_FILE}" listremotes | grep -qx 'gdrive:'

      - name: Mount Google Drive and the SOLIDWORKS ISO
        if: >-
          steps.check-images.outputs.already_verified != 'true' &&
          (steps.check-installed.outputs.exists != 'true' ||
           steps.check-installed.outputs.language_media_required == 'true')
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo mkdir -p "${GDRIVE_MOUNT}" "${SW_MEDIA_MOUNT}"
          sudo chown "${USER}:${USER}" "${GDRIVE_MOUNT}" "${SW_MEDIA_MOUNT}"

          rclone mount gdrive: "${GDRIVE_MOUNT}" \
            --config "${RCLONE_CONFIG_FILE}" \
            --daemon \
            --allow-other \
            --read-only \
            --vfs-cache-mode full \
            --vfs-cache-max-size 20G \
            --vfs-read-ahead 32M \
            --vfs-read-chunk-size 16M \
            --vfs-read-chunk-size-limit 64M \
            --buffer-size 16M \
            --dir-cache-time 24h \
            --attr-timeout 1h \
            --drive-acknowledge-abuse \
            --drive-pacer-min-sleep 10ms \
            --retries 5 \
            --low-level-retries 10 \
            --log-file "${RUNNER_TEMP}/rclone-gdrive.log" \
            --log-level INFO

          iso_path="${GDRIVE_MOUNT}/${SW_MEDIA_PATH}"
          echo "[CI] 等待 Google Drive 虚拟文件系统与 ISO 文件就绪..."
          for attempt in $(seq 1 30); do
            if test -f "${iso_path}"; then
              echo "[CI] 成功检测到 ISO: ${iso_path} ($(stat -c %s "${iso_path}" 2>/dev/null || stat -f %z "${iso_path}" 2>/dev/null || echo 'OK') bytes)"
              break
            fi
            sleep 2
          done

          test -f "${iso_path}" || {
            echo "ISO not found: ${SW_MEDIA_PATH}" >&2
            tail -n 50 "${RUNNER_TEMP}/rclone-gdrive.log" >&2 || true
            exit 1
          }

          sudo mount -o loop,ro,noatime "${iso_path}" "${SW_MEDIA_MOUNT}"
          test -s "${SW_MEDIA_MOUNT}/swwi/data/solidworks.msi"

          df -h /
          findmnt --target "${GDRIVE_MOUNT}"
          findmnt --target "${SW_MEDIA_MOUNT}"

      - name: Fetch test activation assets from Google Drive
        if: steps.check-images.outputs.already_verified != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "[CI fetch] Syncing test activation directory from Google Drive (${SW_ASSETS_PATH})..."
          rclone --config "${RCLONE_CONFIG_FILE}" copy "gdrive:${SW_ASSETS_PATH}" "smoke-test/assets" --progress

          test -d "smoke-test/assets/SolidWorks_Flexnet_Server" || {
            echo "Missing SolidWorks_Flexnet_Server in downloaded assets" >&2
            exit 1
          }

      - name: Build vanilla preinstalled image
        if: steps.check-images.outputs.already_verified != 'true'
        shell: bash
        env:
          SW_SERIAL_SOLIDWORKS: ${{ secrets.SW_SERIAL_SOLIDWORKS }}
        run: |
          set -Eeuo pipefail
          if [ "${{ steps.check-installed.outputs.exists }}" = "true" ]; then
            echo "[CI cache] Reusing installation image entirely inside GHCR..."
            docker buildx imagetools create --prefer-index=false \
              --tag "${SW_PREINSTALLED_IMAGE}" \
              "${SW_PREINSTALLED_REUSABLE_IMAGE}"
          else
            echo "[CI build] Building installation image from the immutable ISO..."
            docker buildx build --push \
              --target sw-preinstalled \
              --build-context "sw-data=preinstall/media/swwi/data" \
              --build-context "sw-toolbox=preinstall/media/Toolbox" \
              --build-context "sw-login=preinstall/media/swloginmgr" \
              --build-context "sw-vcredist=preinstall/media/PreReqs/VCRedist17" \
              --build-context "sw-dotnet=preinstall/media/PreReqs/dotNetFx" \
              --build-arg "RUNTIME_IMAGE=${SW_RUNTIME_IMAGE}" \
              --build-arg "SW_SERIAL_SOLIDWORKS=${SW_SERIAL_SOLIDWORKS}" \
              --cache-from "type=registry,ref=${SW_PREINSTALLED_REPO}:buildcache-image" \
              --cache-to "type=registry,ref=${SW_PREINSTALLED_REPO}:buildcache-image,mode=max,ignore-error=true" \
              -f preinstall/Dockerfile \
              -t "${SW_PREINSTALLED_REUSABLE_IMAGE}" \
              -t "${SW_PREINSTALLED_IMAGE}" \
              .
          fi

          docker buildx build --load \
            --target swcli-delivery \
            --build-arg "IMAGE=${SW_PREINSTALLED_IMAGE}" \
            --build-arg "PAYLOAD_IMAGE=${SW_RUNTIME_PAYLOAD_IMAGE}" \
            --cache-from "type=registry,ref=${SW_PREINSTALLED_REPO}:buildcache-cli" \
            --cache-to "type=registry,ref=${SW_PREINSTALLED_REPO}:buildcache-cli,mode=max,ignore-error=true" \
            -f swcli/Dockerfile.delivery \
            -t "${SW_PREINSTALLED_CLI_IMAGE}" \
            .

      - name: Build sw-executable image
        if: steps.check-images.outputs.already_verified != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "[CI build] Building sw-executable from ${SW_PREINSTALLED_IMAGE}..."
          docker buildx build --push \
            --target sw-executable \
            --build-context "smoke-assets=smoke-test/assets" \
            --build-arg "PREINSTALLED_IMAGE=${SW_PREINSTALLED_IMAGE}" \
            --cache-from "type=registry,ref=${SW_EXECUTABLE_REPO}:buildcache-image" \
            --cache-to "type=registry,ref=${SW_EXECUTABLE_REPO}:buildcache-image,mode=max,ignore-error=true" \
            -f smoke-test/Dockerfile \
            -t "${SW_EXECUTABLE_IMAGE}" \
            .

          docker buildx build --load \
            --target swcli-delivery \
            --build-arg "IMAGE=${SW_EXECUTABLE_IMAGE}" \
            --build-arg "PAYLOAD_IMAGE=${SW_RUNTIME_PAYLOAD_IMAGE}" \
            --cache-from "type=registry,ref=${SW_EXECUTABLE_REPO}:buildcache-cli" \
            --cache-to "type=registry,ref=${SW_EXECUTABLE_REPO}:buildcache-cli,mode=max,ignore-error=true" \
            -f swcli/Dockerfile.delivery \
            -t "${SW_EXECUTABLE_CLI_IMAGE}" \
            .

      - name: Build localized SOLIDWORKS images
        if: steps.check-images.outputs.already_verified != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          while IFS=$'\t' read -r \
            language_tag media_directory language_msi language_id \
            posix_locale solidworks_language \
            language_reusable_image language_cached; do
            preinstalled_language_image="${SW_PREINSTALLED_REPO}:${SW_IMAGE_SHA_TAG}-${language_tag}"
            preinstalled_language_cli_image="${SW_PREINSTALLED_REPO}:${SW_IMAGE_SHA_TAG}-${language_tag}-cli"
            executable_language_image="${SW_EXECUTABLE_REPO}:${SW_IMAGE_SHA_TAG}-${language_tag}"
            executable_language_cli_image="${SW_EXECUTABLE_REPO}:${SW_IMAGE_SHA_TAG}-${language_tag}-cli"

            if [ "${language_cached}" = "true" ]; then
              docker buildx imagetools create --prefer-index=false \
                --tag "${preinstalled_language_image}" \
                "${language_reusable_image}"
            else
              echo "[CI language] Installing ${language_tag} resources from ${media_directory}/${language_msi}..."
              docker buildx build --push \
                --target sw-preinstalled-language \
                --build-context "sw-language=preinstall/media/swwi/lang/${media_directory}" \
                --build-arg "PREINSTALLED_IMAGE=${SW_PREINSTALLED_IMAGE}" \
                --build-arg "SW_LANGUAGE_TAG=${language_tag}" \
                --build-arg "SW_LANGUAGE_DIRECTORY=${media_directory}" \
                --build-arg "SW_LANGUAGE_MSI=${language_msi}" \
                --build-arg "SW_LANGUAGE_ID=${language_id}" \
                --build-arg "SW_POSIX_LOCALE=${posix_locale}" \
                --build-arg "SW_SOLIDWORKS_LANGUAGE=${solidworks_language}" \
                --cache-from "type=registry,ref=${SW_PREINSTALLED_REPO}:buildcache-${language_tag}-language" \
                --cache-to "type=registry,ref=${SW_PREINSTALLED_REPO}:buildcache-${language_tag}-language,mode=max,ignore-error=true" \
                -f preinstall/Dockerfile.language \
                -t "${language_reusable_image}" \
                -t "${preinstalled_language_image}" \
                .
            fi

            docker buildx build --load \
              --target swcli-delivery \
              --build-arg "IMAGE=${preinstalled_language_image}" \
              --build-arg "PAYLOAD_IMAGE=${SW_RUNTIME_PAYLOAD_IMAGE}" \
              --cache-from "type=registry,ref=${SW_PREINSTALLED_REPO}:buildcache-${language_tag}-cli" \
              --cache-to "type=registry,ref=${SW_PREINSTALLED_REPO}:buildcache-${language_tag}-cli,mode=max,ignore-error=true" \
              -f swcli/Dockerfile.delivery \
              -t "${preinstalled_language_cli_image}" \
              .

            docker buildx build --push \
              --target sw-executable \
              --build-context "smoke-assets=smoke-test/assets" \
              --build-arg "PREINSTALLED_IMAGE=${preinstalled_language_image}" \
              --cache-from "type=registry,ref=${SW_EXECUTABLE_REPO}:buildcache-${language_tag}-image" \
              --cache-to "type=registry,ref=${SW_EXECUTABLE_REPO}:buildcache-${language_tag}-image,mode=max,ignore-error=true" \
              -f smoke-test/Dockerfile \
              -t "${executable_language_image}" \
              .

            docker buildx build --load \
              --target swcli-delivery \
              --build-arg "IMAGE=${executable_language_image}" \
              --build-arg "PAYLOAD_IMAGE=${SW_RUNTIME_PAYLOAD_IMAGE}" \
              --cache-from "type=registry,ref=${SW_EXECUTABLE_REPO}:buildcache-${language_tag}-cli" \
              --cache-to "type=registry,ref=${SW_EXECUTABLE_REPO}:buildcache-${language_tag}-cli,mode=max,ignore-error=true" \
              -f swcli/Dockerfile.delivery \
              -t "${executable_language_cli_image}" \
              .
          done < "${SW_LANGUAGE_BUILD_PLAN}"

      - name: Smoke test real SOLIDWORKS exports
        if: steps.check-images.outputs.already_verified != 'true'
        shell: bash
        timeout-minutes: 10
        run: |
          set -Eeuo pipefail

          smoke_container="sw-cli-export-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          smoke_root="${RUNNER_TEMP}/sw-cli-export-smoke"
          output_dir="${smoke_root}/output"
          log_file="${smoke_root}/sw-cli-export.log"

          rm -rf "${smoke_root}"
          mkdir -p "${output_dir}"
          docker rm -f "${smoke_container}" >/dev/null 2>&1 || true

          docker run --rm \
            --name "${smoke_container}" \
            --mount "type=bind,source=${smoke_root},target=/ci-smoke" \
            --mount "type=bind,source=${GITHUB_WORKSPACE}/smoke-test/export.sh,target=/opt/dockersw-smoke/export.sh,readonly" \
            --mount "type=bind,source=${GITHUB_WORKSPACE}/smoke-test/verify-swcli.sh,target=/opt/dockersw-smoke/verify-swcli.sh,readonly" \
            "${SW_EXECUTABLE_CLI_IMAGE}" \
            bash /opt/dockersw-smoke/export.sh 2>&1 \
            | tee "${log_file}"

          expected_outputs=(
            "bezel moldbase.PDF"
            "bezel moldbase.DWG"
            "bezel moldbase.STEP"
            "cabinet_bath.PDF"
            "cabinet_bath.DWG"
            "Paper Airplane.STEP"
          )
          for output_name in "${expected_outputs[@]}"; do
            output_path="${output_dir}/${output_name}"
            test -s "${output_path}" || {
              echo "Expected export is missing or empty: ${output_name}" >&2
              exit 1
            }
            printf '[CI export] verified %s (%s bytes)\n' \
              "${output_name}" "$(stat -c %s "${output_path}")"
          done
          echo "SOLIDWORKS export smoke test passed: ${#expected_outputs[@]} files verified."

      - name: Smoke test localized SOLIDWORKS images
        if: steps.check-images.outputs.already_verified != 'true'
        shell: bash
        timeout-minutes: 30
        run: |
          set -Eeuo pipefail
          while IFS=$'\t' read -r \
            language_tag media_directory _language_msi _language_id \
            _posix_locale solidworks_language \
            _language_reusable_image _language_cached; do
            smoke_container="sw-language-smoke-${GITHUB_RUN_ID}-${language_tag}"
            smoke_root="${RUNNER_TEMP}/sw-language-smoke/${language_tag}"
            output_dir="${smoke_root}/output"
            log_file="${smoke_root}/sw-cli-export.log"
            executable_language_cli_image="${SW_EXECUTABLE_REPO}:${SW_IMAGE_SHA_TAG}-${language_tag}-cli"

            rm -rf "${smoke_root}"
            mkdir -p "${output_dir}"
            docker rm -f "${smoke_container}" >/dev/null 2>&1 || true
            docker run --rm \
              --name "${smoke_container}" \
              --env "SW_LANGUAGE_RESOURCE_DIR=${media_directory}" \
              --env "SW_SOLIDWORKS_LANGUAGE=${solidworks_language}" \
              --mount "type=bind,source=${smoke_root},target=/ci-smoke" \
              --mount "type=bind,source=${GITHUB_WORKSPACE}/smoke-test/export-localized.sh,target=/opt/dockersw-smoke/export-localized.sh,readonly" \
              "${executable_language_cli_image}" \
              bash /opt/dockersw-smoke/export-localized.sh 2>&1 \
              | tee "${log_file}"
            test -s "${output_dir}/Paper Airplane.STEP"
            echo "[CI language] ${language_tag} UI language and real STEP export verified."
          done < "${SW_LANGUAGE_BUILD_PLAN}"

      - name: Publish verified CLI images & promote atomically
        if: steps.check-images.outputs.already_verified != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          # 不直接 docker push 冒烟时 --load 的镜像：Docker Engine 会重新压缩父层，
          # 导致数 GB 的 SOLIDWORKS 层以新 digest 重复上传。由 BuildKit 重新组合
          # registry manifest，可直接复用默认镜像与 SWCLI payload 的既有 blob。
          publish_cli_image() {
            local source_image="$1"
            local target_image="$2"
            local cache_ref="$3"
            docker buildx build --push \
              --target swcli-delivery \
              --build-arg "IMAGE=${source_image}" \
              --build-arg "PAYLOAD_IMAGE=${SW_RUNTIME_PAYLOAD_IMAGE}" \
              --cache-from "type=registry,ref=${cache_ref}" \
              -f swcli/Dockerfile.delivery \
              -t "${target_image}" \
              .
          }

          echo "[CI push] Smoke test PASSED! Publishing CLI manifests through BuildKit..."
          publish_cli_image \
            "${SW_PREINSTALLED_IMAGE}" \
            "${SW_PREINSTALLED_CLI_IMAGE}" \
            "${SW_PREINSTALLED_REPO}:buildcache-cli"
          publish_cli_image \
            "${SW_EXECUTABLE_IMAGE}" \
            "${SW_EXECUTABLE_CLI_IMAGE}" \
            "${SW_EXECUTABLE_REPO}:buildcache-cli"
          while IFS=$'\t' read -r language_tag _; do
            publish_cli_image \
              "${SW_PREINSTALLED_REPO}:${SW_IMAGE_SHA_TAG}-${language_tag}" \
              "${SW_PREINSTALLED_REPO}:${SW_IMAGE_SHA_TAG}-${language_tag}-cli" \
              "${SW_PREINSTALLED_REPO}:buildcache-${language_tag}-cli"
            publish_cli_image \
              "${SW_EXECUTABLE_REPO}:${SW_IMAGE_SHA_TAG}-${language_tag}" \
              "${SW_EXECUTABLE_REPO}:${SW_IMAGE_SHA_TAG}-${language_tag}-cli" \
              "${SW_EXECUTABLE_REPO}:buildcache-${language_tag}-cli"
          done < "${SW_LANGUAGE_BUILD_PLAN}"

          target_tag="${{ github.ref_name }}"
          if [ -n "${target_tag}" ]; then
            promote_image() {
              local source_image="$1"
              local branch_tag="$2"
              local latest_tag="$3"
              local -a tags=(--tag "${branch_tag}")
              if [ "${target_tag}" = "main" ]; then
                tags+=(--tag "${latest_tag}")
              fi
              docker buildx imagetools create --prefer-index=false \
                "${tags[@]}" "${source_image}"
            }

            echo "[CI promote] Promoting verified tags for ${target_tag}..."
            promote_image "${SW_RUNTIME_IMAGE}" \
              "${SW_RUNTIME_REPO}:${target_tag}" "${SW_RUNTIME_REPO}:latest"
            promote_image "${SW_RUNTIME_CLI_IMAGE}" \
              "${SW_RUNTIME_REPO}:${target_tag}-cli" "${SW_RUNTIME_REPO}:latest-cli"
            promote_image "${SW_PREINSTALLED_IMAGE}" \
              "${SW_PREINSTALLED_REPO}:${target_tag}" "${SW_PREINSTALLED_REPO}:latest"
            promote_image "${SW_PREINSTALLED_CLI_IMAGE}" \
              "${SW_PREINSTALLED_REPO}:${target_tag}-cli" "${SW_PREINSTALLED_REPO}:latest-cli"
            promote_image "${SW_EXECUTABLE_IMAGE}" \
              "${SW_EXECUTABLE_REPO}:${target_tag}" "${SW_EXECUTABLE_REPO}:latest"
            promote_image "${SW_EXECUTABLE_CLI_IMAGE}" \
              "${SW_EXECUTABLE_REPO}:${target_tag}-cli" "${SW_EXECUTABLE_REPO}:latest-cli"

            while IFS=$'\t' read -r language_tag _; do
              promote_image \
                "${SW_PREINSTALLED_REPO}:${SW_IMAGE_SHA_TAG}-${language_tag}" \
                "${SW_PREINSTALLED_REPO}:${target_tag}-${language_tag}" \
                "${SW_PREINSTALLED_REPO}:latest-${language_tag}"
              promote_image \
                "${SW_PREINSTALLED_REPO}:${SW_IMAGE_SHA_TAG}-${language_tag}-cli" \
                "${SW_PREINSTALLED_REPO}:${target_tag}-${language_tag}-cli" \
                "${SW_PREINSTALLED_REPO}:latest-${language_tag}-cli"
              promote_image \
                "${SW_EXECUTABLE_REPO}:${SW_IMAGE_SHA_TAG}-${language_tag}" \
                "${SW_EXECUTABLE_REPO}:${target_tag}-${language_tag}" \
                "${SW_EXECUTABLE_REPO}:latest-${language_tag}"
              promote_image \
                "${SW_EXECUTABLE_REPO}:${SW_IMAGE_SHA_TAG}-${language_tag}-cli" \
                "${SW_EXECUTABLE_REPO}:${target_tag}-${language_tag}-cli" \
                "${SW_EXECUTABLE_REPO}:latest-${language_tag}-cli"
            done < "${SW_LANGUAGE_BUILD_PLAN}"
          fi

      - name: Show storage usage
        if: always() && steps.check-images.outputs.already_verified != 'true'
        shell: bash
        run: |
          df -h / || true
          docker system df || true

      - name: Unmount installation media
        if: always() && steps.check-images.outputs.already_verified != 'true'
        shell: bash
        run: |
          docker rm -f "sw-cli-export-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >/dev/null 2>&1 || true
          while IFS=$'\t' read -r language_tag _; do
            docker rm -f "sw-language-smoke-${GITHUB_RUN_ID}-${language_tag}" >/dev/null 2>&1 || true
          done < "${SW_LANGUAGE_PLAN}" 2>/dev/null || true
          rm -rf smoke-test/assets
          sudo umount "${SW_MEDIA_MOUNT}" 2>/dev/null || true
          fusermount3 -u "${GDRIVE_MOUNT}" 2>/dev/null || \
            sudo umount "${GDRIVE_MOUNT}" 2>/dev/null || true
          tail -n 100 "${RUNNER_TEMP}/rclone-gdrive.log" 2>/dev/null || true
          rm -f "${RCLONE_CONFIG_FILE}"

      - name: Upload private installer logs
        if: failure() && steps.check-images.outputs.already_verified != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: sw-install-logs-${{ github.run_id }}
          path: ${{ runner.temp }}/sw-install-logs
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload export smoke-test artifacts
        if: always() && steps.check-images.outputs.already_verified != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: sw-cli-export-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/sw-cli-export-smoke
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload localized export smoke-test artifacts
        if: always() && steps.check-images.outputs.already_verified != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: sw-language-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/sw-language-smoke
          if-no-files-found: ignore
          retention-days: 14
