name: Build & Verify SolidWorks Images

on:
  push:
    branches:
      - main
      - '20[0-9][0-9]'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force full rebuild even if image for this commit SHA exists on GHCR'
        type: boolean
        default: false
      media_path:
        description: 'Path to the ISO inside the Google Drive remote'
        type: string
        default: 'Share/Software/DS.SolidWorks.2025.SP5.0.Premium-SSQ/SolidWorks.2025.SP5.0.Premium.DVD.iso'
      assets_path:
        description: 'Path to activation crack assets inside the Google Drive remote'
        type: string
        default: 'Share/Software/DS.SolidWorks.2025.SP5.0.Premium-SSQ/crack'

permissions:
  contents: read
  packages: write

concurrency:
  # 各 package 内的 base/delivery 分别使用独立 GHCR buildcache 标签；
  # 串行执行可避免连续 push 各自重跑安装链，并防止并发覆盖缓存索引。
  group: dockersw-image-pipeline
  cancel-in-progress: false

jobs:
  unit-tests:
    name: Run Python Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Validate Shell Scripts
        run: |
          bash -n runtime/init_wineprefix.sh
          bash -n runtime/entrypoint.sh
          bash -n runtime/fetch_managed_com.sh
          bash -n runtime/prepare_managed_com.sh
          bash -n runtime/install_swcli.sh
          bash -n runtime/bin/*
          bash -n smoke-test/export.sh
          perl -c runtime/patch_win32u.pl
          perl -c runtime/patch_wine_mono.pl

      - name: Run Logic Tests
        run: |
          python -m unittest discover -s runtime/tests -p "test_*.py" -v
          PYTHONPATH=SWCLI/src python -m unittest discover -s SWCLI/tests -p "test_*.py" -v

  build-runtime:
    name: Build sw-runtime Image
    needs: unit-tests
    runs-on: ubuntu-latest
    env:
      SW_RUNTIME_REPO: ghcr.io/yjbeetle/sw-runtime
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve runtime image names
        shell: bash
        run: |
          set -Eeuo pipefail
          commit_sha="$(git rev-parse --short=7 HEAD)"
          echo "SW_RUNTIME_BASE_IMAGE=${SW_RUNTIME_REPO}:sha-${commit_sha}-base" >> "${GITHUB_ENV}"
          echo "SW_RUNTIME_IMAGE=${SW_RUNTIME_REPO}:sha-${commit_sha}" >> "${GITHUB_ENV}"

      - name: Check if runtime images already exist on GHCR
        id: check-runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          force="${{ inputs.force_rebuild || 'false' }}"

          if [ "${force}" != "true" ] && \
             docker manifest inspect "${SW_RUNTIME_BASE_IMAGE}" >/dev/null 2>&1 && \
             docker manifest inspect "${SW_RUNTIME_IMAGE}" >/dev/null 2>&1; then
            echo "[CI fast-path] runtime base 与正式镜像均已存在，跳过重复构建。"
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "[CI] 镜像不存在或要求强制重构，继续执行构建流程..."
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Build and load sw-runtime-base image
        if: steps.check-runtime.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: runtime/Dockerfile
          target: sw-runtime-base
          load: true
          tags: |
            sw-runtime-base:local-test
            ${{ env.SW_RUNTIME_BASE_IMAGE }}
          cache-from: type=registry,ref=ghcr.io/yjbeetle/sw-runtime:buildcache-base
          cache-to: type=registry,ref=ghcr.io/yjbeetle/sw-runtime:buildcache-base,mode=max,ignore-error=true

      - name: Build and Load sw-runtime Image
        if: steps.check-runtime.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: runtime/Dockerfile
          target: sw-runtime
          load: true
          tags: |
            sw-runtime:local-test
            ${{ env.SW_RUNTIME_IMAGE }}
          # 用 GHCR 上的专用 buildcache 标签替代 GHA 缓存：镜像本就推送到同一仓库，
          # registry 缓存可与已存在的 blob 去重，避免 GHA 缓存每次上传数 GB（约 195s）。
          cache-from: type=registry,ref=ghcr.io/yjbeetle/sw-runtime:buildcache-delivery
          cache-to: type=registry,ref=ghcr.io/yjbeetle/sw-runtime:buildcache-delivery,mode=max,ignore-error=true

      - name: Smoke Test (Wine, Mono COM, Python, pywin32 & CLI)
        if: steps.check-runtime.outputs.exists != 'true'
        run: |
          echo "[CI] 验证 0: base 镜像不包含 SWCLI，且安装器可用..."
          docker run --rm --entrypoint bash sw-runtime-base:local-test -lc \
            'test ! -e /opt/swcli && sw-install --help >/dev/null'

          echo "[CI] 验证 1: 测试固定 Wine 版本与 Windows 虚拟版本..."
          test "$(docker run --rm --entrypoint wine sw-runtime:local-test --version)" = "wine-11.16"
          docker run --rm sw-runtime:local-test wine cmd /c ver

          echo "[CI] 验证 2: 测试 Wine-Mono stdcall 与托管 COM 注册组件..."
          docker run --rm sw-runtime:local-test /usr/local/lib/sw-runtime/prepare_managed_com.sh

          echo "[CI] 验证 3: 测试 Windows Python 3.11 与 pywin32 COM 模块就绪..."
          docker run --rm sw-runtime:local-test wine "C:\\Python311\\python.exe" -c "import win32com.client, pythoncom; print('[HEALTH CHECK OK] Windows Python & pywin32 ready')"

          echo "[CI] 验证 4: 运行 Linux Python SWCLI 客户端与 Wine daemon 命令行..."
          docker run --rm sw-runtime:local-test sw-cli version --json
          docker run --rm sw-runtime:local-test sw-cli daemon --help

          echo "[CI] 验证 5: 安装器命令已内置..."
          docker run --rm sw-runtime:local-test sw-install --help

          echo "[CI] 验证 6: 检查 Wine OpenGL 24-bit DIB 补丁已应用..."
          docker run --rm sw-runtime:local-test perl /usr/local/lib/sw-runtime/patch_win32u.pl

      - name: Push Verified Image to GHCR
        if: steps.check-runtime.outputs.exists != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "[CI] 验证通过，推送 runtime base 与正式镜像至 GHCR..."
          docker push "${SW_RUNTIME_BASE_IMAGE}"
          docker push "${SW_RUNTIME_IMAGE}"

  build-and-smoke-test:
    name: Build & Smoke Test SolidWorks
    needs: build-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      RCLONE_CONFIG_FILE: /tmp/rclone-${{ github.run_id }}-${{ github.run_attempt }}.conf
      GDRIVE_MOUNT: /mnt/gdrive
      SW_MEDIA_MOUNT: preinstall/media
      SW_MEDIA_PATH: ${{ inputs.media_path || 'Share/Software/DS.SolidWorks.2025.SP5.0.Premium-SSQ/SolidWorks.2025.SP5.0.Premium.DVD.iso' }}
      SW_ASSETS_PATH: ${{ inputs.assets_path || 'Share/Software/DS.SolidWorks.2025.SP5.0.Premium-SSQ/crack' }}
      SW_RUNTIME_REPO: ghcr.io/yjbeetle/sw-runtime
      SW_PREINSTALLED_REPO: ghcr.io/yjbeetle/sw-preinstalled
      SW_EXECUTABLE_REPO: ghcr.io/yjbeetle/sw-executable
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Resolve image names
        shell: bash
        run: |
          set -Eeuo pipefail
          commit_sha="$(git rev-parse --short=7 HEAD)"
          echo "SW_IMAGE_SHA_TAG=sha-${commit_sha}" >> "${GITHUB_ENV}"
          echo "SW_RUNTIME_BASE_IMAGE=${SW_RUNTIME_REPO}:sha-${commit_sha}-base" >> "${GITHUB_ENV}"
          echo "SW_RUNTIME_IMAGE=${SW_RUNTIME_REPO}:sha-${commit_sha}" >> "${GITHUB_ENV}"
          echo "SW_PREINSTALLED_BASE_IMAGE=${SW_PREINSTALLED_REPO}:sha-${commit_sha}-base" >> "${GITHUB_ENV}"
          echo "SW_PREINSTALLED_IMAGE=${SW_PREINSTALLED_REPO}:sha-${commit_sha}" >> "${GITHUB_ENV}"
          echo "SW_EXECUTABLE_BASE_IMAGE=${SW_EXECUTABLE_REPO}:sha-${commit_sha}-base" >> "${GITHUB_ENV}"
          echo "SW_EXECUTABLE_IMAGE=${SW_EXECUTABLE_REPO}:sha-${commit_sha}" >> "${GITHUB_ENV}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if images are already verified and built for this commit
        id: check-images
        shell: bash
        run: |
          set -Eeuo pipefail
          force="${{ inputs.force_rebuild || 'false' }}"
          target_tag="${{ github.ref_name }}"

          if [ "${force}" != "true" ] && \
             docker manifest inspect "${SW_PREINSTALLED_BASE_IMAGE}" >/dev/null 2>&1 && \
             docker manifest inspect "${SW_PREINSTALLED_IMAGE}" >/dev/null 2>&1 && \
             docker manifest inspect "${SW_EXECUTABLE_BASE_IMAGE}" >/dev/null 2>&1 && \
             docker manifest inspect "${SW_EXECUTABLE_IMAGE}" >/dev/null 2>&1; then
            echo "[CI fast-path] 检测到当前提交 (${SW_IMAGE_SHA_TAG}) 的四个下游镜像均已完成验证！"
            echo "[CI fast-path] 跳过 30+ 分钟的 ISO 挂载、预安装与冒烟测试，秒级晋升标签..."

            if [ -n "${target_tag}" ]; then
              echo "[CI fast-path] 晋升分支标签: ${target_tag}..."
              docker buildx imagetools create --tag "${SW_RUNTIME_REPO}:${target_tag}" "${SW_RUNTIME_IMAGE}" || true
              docker buildx imagetools create --tag "${SW_PREINSTALLED_REPO}:${target_tag}" "${SW_PREINSTALLED_IMAGE}"
              docker buildx imagetools create --tag "${SW_EXECUTABLE_REPO}:${target_tag}" "${SW_EXECUTABLE_IMAGE}"
            fi

            if [ "${target_tag}" = "main" ]; then
              echo "[CI fast-path] 晋升 :latest 标签..."
              docker buildx imagetools create --tag "${SW_RUNTIME_REPO}:latest" "${SW_RUNTIME_IMAGE}" || true
              docker buildx imagetools create --tag "${SW_PREINSTALLED_REPO}:latest" "${SW_PREINSTALLED_IMAGE}"
              docker buildx imagetools create --tag "${SW_EXECUTABLE_REPO}:latest" "${SW_EXECUTABLE_IMAGE}"
            fi

            echo "already_verified=true" >> "${GITHUB_OUTPUT}"
          else
            echo "[CI] 镜像未验证或需要全量重构，继续执行预装与冒烟测试..."
            echo "already_verified=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Resolve reusable SOLIDWORKS installation base
        id: check-installed-base
        if: steps.check-images.outputs.already_verified != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          force="${{ inputs.force_rebuild || 'false' }}"

          # The installation ISO is an immutable input. Reuse the installed image
          # whenever the runtime base, installation recipe and configured media
          # identity are unchanged; do not mount or scan the ISO merely to ask
          # BuildKit whether its RUN layer is cached.
          docker pull "${SW_RUNTIME_BASE_IMAGE}"
          runtime_base_digest="$(
            docker image inspect "${SW_RUNTIME_BASE_IMAGE}" \
              --format '{{index .RepoDigests 0}}' | sed 's/.*@//'
          )"
          recipe_digest="$(sha256sum preinstall/Dockerfile.base | cut -d' ' -f1)"
          install_key="$(
            printf '%s\n%s\n%s\n' \
              "${runtime_base_digest}" \
              "${recipe_digest}" \
              "${SW_MEDIA_PATH}" | sha256sum | cut -d' ' -f1
          )"
          reusable_image="${SW_PREINSTALLED_REPO}:install-${install_key:0:32}-base"

          echo "SW_PREINSTALLED_REUSABLE_IMAGE=${reusable_image}" >> "${GITHUB_ENV}"
          echo "[CI cache] SOLIDWORKS installation identity: install-${install_key:0:32}-base"

          if [ "${force}" != "true" ] && \
             docker manifest inspect "${reusable_image}" >/dev/null 2>&1; then
            echo "[CI cache] Reusing installed SOLIDWORKS base; ISO access is unnecessary."
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "[CI cache] Installed base is missing or rebuild was forced; ISO access is required."
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Inspect runner disk capacity
        id: runner-disk
        if: steps.check-images.outputs.already_verified != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          required_kib=$((40 * 1024 * 1024))
          available_kib="$(df --output=avail -k / | tail -n 1 | tr -d ' ')"
          df -h /
          if [ "${available_kib}" -lt "${required_kib}" ]; then
            echo "cleanup_required=true" >> "${GITHUB_OUTPUT}"
          else
            echo "cleanup_required=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Reclaim runner disk space when required
        if: >-
          steps.check-images.outputs.already_verified != 'true' &&
          steps.runner-disk.outputs.cleanup_required == 'true'
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          swap-storage: true

      - name: Verify runner disk capacity
        if: steps.check-images.outputs.already_verified != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          required_kib=$((40 * 1024 * 1024))
          available_kib="$(df --output=avail -k / | tail -n 1 | tr -d ' ')"
          df -h /
          if [ "${available_kib}" -lt "${required_kib}" ]; then
            available_gib="$((available_kib / 1024 / 1024))"
            echo "Runner disk is too small after cleanup: ${available_gib} GiB available; at least 40 GiB is required." >&2
            exit 1
          fi

      - name: Install rclone and FUSE
        if: steps.check-images.outputs.already_verified != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fuse3 \
            ca-certificates \
            curl \
            unzip
          curl -fsSL https://rclone.org/install.sh | sudo bash
          echo "user_allow_other" | sudo tee -a /etc/fuse.conf >/dev/null

      - name: Prepare Google Drive configuration
        if: steps.check-images.outputs.already_verified != 'true'
        shell: bash
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
        run: |
          set -Eeuo pipefail
          test -n "${RCLONE_CONFIG_B64}" || {
            echo "Missing secret: RCLONE_CONFIG_B64" >&2
            exit 1
          }

          install -m 0600 /dev/null "${RCLONE_CONFIG_FILE}"
          echo "${RCLONE_CONFIG_B64}" | base64 -d > "${RCLONE_CONFIG_FILE}"
          rclone --config "${RCLONE_CONFIG_FILE}" listremotes | grep -qx 'gdrive:'

      - name: Mount Google Drive and the SOLIDWORKS ISO
        if: >-
          steps.check-images.outputs.already_verified != 'true' &&
          steps.check-installed-base.outputs.exists != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo mkdir -p "${GDRIVE_MOUNT}" "${SW_MEDIA_MOUNT}"
          sudo chown "${USER}:${USER}" "${GDRIVE_MOUNT}" "${SW_MEDIA_MOUNT}"

          rclone mount gdrive: "${GDRIVE_MOUNT}" \
            --config "${RCLONE_CONFIG_FILE}" \
            --daemon \
            --allow-other \
            --read-only \
            --vfs-cache-mode full \
            --vfs-cache-max-size 20G \
            --vfs-read-ahead 32M \
            --vfs-read-chunk-size 16M \
            --vfs-read-chunk-size-limit 64M \
            --buffer-size 16M \
            --dir-cache-time 24h \
            --attr-timeout 1h \
            --drive-acknowledge-abuse \
            --drive-pacer-min-sleep 10ms \
            --retries 5 \
            --low-level-retries 10 \
            --log-file "${RUNNER_TEMP}/rclone-gdrive.log" \
            --log-level INFO

          iso_path="${GDRIVE_MOUNT}/${SW_MEDIA_PATH}"
          echo "[CI] 等待 Google Drive 虚拟文件系统与 ISO 文件就绪..."
          for attempt in $(seq 1 30); do
            if test -f "${iso_path}"; then
              echo "[CI] 成功检测到 ISO: ${iso_path} ($(stat -c %s "${iso_path}" 2>/dev/null || stat -f %z "${iso_path}" 2>/dev/null || echo 'OK') bytes)"
              break
            fi
            sleep 2
          done

          test -f "${iso_path}" || {
            echo "ISO not found: ${SW_MEDIA_PATH}" >&2
            tail -n 50 "${RUNNER_TEMP}/rclone-gdrive.log" >&2 || true
            exit 1
          }

          sudo mount -o loop,ro,noatime "${iso_path}" "${SW_MEDIA_MOUNT}"
          test -s "${SW_MEDIA_MOUNT}/swwi/data/solidworks.msi"

          df -h /
          findmnt --target "${GDRIVE_MOUNT}"
          findmnt --target "${SW_MEDIA_MOUNT}"

      - name: Fetch test activation assets from Google Drive
        if: steps.check-images.outputs.already_verified != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "[CI fetch] Syncing test activation directory from Google Drive (${SW_ASSETS_PATH})..."
          rclone --config "${RCLONE_CONFIG_FILE}" copy "gdrive:${SW_ASSETS_PATH}" "smoke-test/assets" --progress

          test -d "smoke-test/assets/SolidWorks_Flexnet_Server" || {
            echo "Missing SolidWorks_Flexnet_Server in downloaded assets" >&2
            exit 1
          }

      - name: Build vanilla preinstalled image
        if: steps.check-images.outputs.already_verified != 'true'
        shell: bash
        env:
          SW_SERIAL_SOLIDWORKS: ${{ secrets.SW_SERIAL_SOLIDWORKS }}
          SW_SERIAL_SIMULATION: ${{ secrets.SW_SERIAL_SIMULATION }}
          SW_SERIAL_MOTION: ${{ secrets.SW_SERIAL_MOTION }}
          SW_SERIAL_MBD: ${{ secrets.SW_SERIAL_MBD }}
        run: |
          set -Eeuo pipefail
          docker pull "${SW_RUNTIME_IMAGE}"

          if [ "${{ steps.check-installed-base.outputs.exists }}" = "true" ]; then
            echo "[CI cache] Pulling reusable installation base without mounting the ISO..."
            docker pull "${SW_PREINSTALLED_REUSABLE_IMAGE}"
            docker tag "${SW_PREINSTALLED_REUSABLE_IMAGE}" "${SW_PREINSTALLED_BASE_IMAGE}"
          else
            echo "[CI build] Building installation base from the immutable ISO..."
            docker buildx build --load \
              --target sw-preinstalled-base \
              --build-context "sw-data=preinstall/media/swwi/data" \
              --build-context "sw-toolbox=preinstall/media/Toolbox" \
              --build-context "sw-login=preinstall/media/swloginmgr" \
              --build-context "sw-vcredist=preinstall/media/PreReqs/VCRedist17" \
              --build-context "sw-dotnet=preinstall/media/PreReqs/dotNetFx" \
              --build-arg "BASE_IMAGE=${SW_RUNTIME_BASE_IMAGE}" \
              --build-arg "SW_SERIAL_SOLIDWORKS=${SW_SERIAL_SOLIDWORKS}" \
              --build-arg "SW_SERIAL_SIMULATION=${SW_SERIAL_SIMULATION}" \
              --build-arg "SW_SERIAL_MOTION=${SW_SERIAL_MOTION}" \
              --build-arg "SW_SERIAL_MBD=${SW_SERIAL_MBD}" \
              --cache-from "type=registry,ref=${SW_PREINSTALLED_REPO}:buildcache-base" \
              --cache-to "type=registry,ref=${SW_PREINSTALLED_REPO}:buildcache-base,mode=max,ignore-error=true" \
              -f preinstall/Dockerfile.base \
              -t "${SW_PREINSTALLED_REUSABLE_IMAGE}" \
              -t "${SW_PREINSTALLED_BASE_IMAGE}" \
              .
            docker push "${SW_PREINSTALLED_REUSABLE_IMAGE}"
          fi

          # Publish the immutable per-commit candidate before the delivery build:
          # the docker-container builder cannot resolve images loaded only into
          # the host Docker Engine.
          docker push "${SW_PREINSTALLED_BASE_IMAGE}"

          docker buildx build --load \
            --target sw-preinstalled \
            --build-arg "BASE_IMAGE=${SW_PREINSTALLED_BASE_IMAGE}" \
            --build-arg "APP_IMAGE=${SW_RUNTIME_IMAGE}" \
            --cache-from "type=registry,ref=${SW_PREINSTALLED_REPO}:buildcache-delivery" \
            --cache-to "type=registry,ref=${SW_PREINSTALLED_REPO}:buildcache-delivery,mode=max,ignore-error=true" \
            -f preinstall/Dockerfile \
            -t "${SW_PREINSTALLED_IMAGE}" \
            .

      - name: Build sw-executable image (from local sw-preinstalled, zero pull overhead)
        if: steps.check-images.outputs.already_verified != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "[CI build] Building sw-executable locally from ${SW_PREINSTALLED_IMAGE}..."
          docker buildx build --load \
            --target sw-executable-base \
            --build-context "smoke-assets=smoke-test/assets" \
            --build-arg "BASE_IMAGE=${SW_PREINSTALLED_BASE_IMAGE}" \
            --cache-from "type=registry,ref=${SW_EXECUTABLE_REPO}:buildcache-base" \
            --cache-to "type=registry,ref=${SW_EXECUTABLE_REPO}:buildcache-base,mode=max,ignore-error=true" \
            -f smoke-test/Dockerfile.base \
            -t "${SW_EXECUTABLE_BASE_IMAGE}" \
            .

          # The delivery Dockerfile consumes the base as an external image.
          # Publish this immutable candidate so the docker-container builder can
          # resolve it without rebuilding or reading the private test assets.
          docker push "${SW_EXECUTABLE_BASE_IMAGE}"

          docker buildx build --load \
            --target sw-executable \
            --build-arg "BASE_IMAGE=${SW_EXECUTABLE_BASE_IMAGE}" \
            --build-arg "APP_IMAGE=${SW_RUNTIME_IMAGE}" \
            --cache-from "type=registry,ref=${SW_EXECUTABLE_REPO}:buildcache-delivery" \
            --cache-to "type=registry,ref=${SW_EXECUTABLE_REPO}:buildcache-delivery,mode=max,ignore-error=true" \
            -f smoke-test/Dockerfile \
            -t "${SW_EXECUTABLE_IMAGE}" \
            .

      - name: Smoke test real SOLIDWORKS exports
        if: steps.check-images.outputs.already_verified != 'true'
        shell: bash
        timeout-minutes: 10
        run: |
          set -Eeuo pipefail

          smoke_container="sw-cli-export-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          smoke_root="${RUNNER_TEMP}/sw-cli-export-smoke"
          output_dir="${smoke_root}/output"
          log_file="${smoke_root}/sw-cli-export.log"

          rm -rf "${smoke_root}"
          mkdir -p "${output_dir}"
          docker rm -f "${smoke_container}" >/dev/null 2>&1 || true

          docker run --rm \
            --name "${smoke_container}" \
            --mount "type=bind,source=${smoke_root},target=/ci-smoke" \
            --mount "type=bind,source=${GITHUB_WORKSPACE}/smoke-test/export.sh,target=/opt/dockersw-smoke/export.sh,readonly" \
            "${SW_EXECUTABLE_IMAGE}" \
            bash /opt/dockersw-smoke/export.sh 2>&1 \
            | tee "${log_file}"

          expected_outputs=(
            "bezel moldbase.PDF"
            "bezel moldbase.DWG"
            "bezel moldbase.STEP"
            "cabinet_bath.PDF"
            "cabinet_bath.DWG"
            "Paper Airplane.STEP"
          )
          for output_name in "${expected_outputs[@]}"; do
            output_path="${output_dir}/${output_name}"
            test -s "${output_path}" || {
              echo "Expected export is missing or empty: ${output_name}" >&2
              exit 1
            }
            printf '[CI export] verified %s (%s bytes)\n' \
              "${output_name}" "$(stat -c %s "${output_path}")"
          done
          echo "SOLIDWORKS export smoke test passed: ${#expected_outputs[@]} files verified."

      - name: Publish verified images & promote atomically
        if: steps.check-images.outputs.already_verified != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "[CI push] Smoke test PASSED! Publishing verified candidates to GHCR..."
          docker push "${SW_PREINSTALLED_IMAGE}"
          docker push "${SW_EXECUTABLE_BASE_IMAGE}"
          docker push "${SW_EXECUTABLE_IMAGE}"

          target_tag="${{ github.ref_name }}"
          if [ -n "${target_tag}" ]; then
            echo "[CI promote] Promoting verified tags for ${target_tag}..."
            docker tag "${SW_RUNTIME_IMAGE}" "${SW_RUNTIME_REPO}:${target_tag}"
            docker push "${SW_RUNTIME_REPO}:${target_tag}"

            docker tag "${SW_PREINSTALLED_IMAGE}" "${SW_PREINSTALLED_REPO}:${target_tag}"
            docker push "${SW_PREINSTALLED_REPO}:${target_tag}"

            docker tag "${SW_EXECUTABLE_IMAGE}" "${SW_EXECUTABLE_REPO}:${target_tag}"
            docker push "${SW_EXECUTABLE_REPO}:${target_tag}"
          fi

          if [ "${target_tag}" = "main" ]; then
            echo "[CI promote] Promoting verified :latest tags..."
            docker tag "${SW_RUNTIME_IMAGE}" "${SW_RUNTIME_REPO}:latest"
            docker push "${SW_RUNTIME_REPO}:latest"

            docker tag "${SW_PREINSTALLED_IMAGE}" "${SW_PREINSTALLED_REPO}:latest"
            docker push "${SW_PREINSTALLED_REPO}:latest"

            docker tag "${SW_EXECUTABLE_IMAGE}" "${SW_EXECUTABLE_REPO}:latest"
            docker push "${SW_EXECUTABLE_REPO}:latest"
          fi

      - name: Show storage usage
        if: always() && steps.check-images.outputs.already_verified != 'true'
        shell: bash
        run: |
          df -h / || true
          docker system df || true

      - name: Unmount installation media
        if: always() && steps.check-images.outputs.already_verified != 'true'
        shell: bash
        run: |
          docker rm -f "sw-cli-export-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >/dev/null 2>&1 || true
          rm -rf smoke-test/assets
          sudo umount "${SW_MEDIA_MOUNT}" 2>/dev/null || true
          fusermount3 -u "${GDRIVE_MOUNT}" 2>/dev/null || \
            sudo umount "${GDRIVE_MOUNT}" 2>/dev/null || true
          tail -n 100 "${RUNNER_TEMP}/rclone-gdrive.log" 2>/dev/null || true
          rm -f "${RCLONE_CONFIG_FILE}"

      - name: Upload private installer logs
        if: failure() && steps.check-images.outputs.already_verified != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: sw-install-logs-${{ github.run_id }}
          path: ${{ runner.temp }}/sw-install-logs
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload export smoke-test artifacts
        if: always() && steps.check-images.outputs.already_verified != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: sw-cli-export-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/sw-cli-export-smoke
          if-no-files-found: ignore
          retention-days: 14
