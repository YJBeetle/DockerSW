name: Build and Test DockerSW

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  unit-tests:
    name: Run Python Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Validate Shell Scripts
        run: |
          bash -n docker/init_wineprefix.sh
          bash -n docker/entrypoint.sh
          bash -n docker/fetch_managed_com.sh
          bash -n docker/prepare_managed_com.sh
          bash -n scripts/dockersw-export
          bash -n scripts/install_solidworks.sh

      - name: Run Logic Tests
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

  build-and-publish:
    name: Build & Smoke Test Docker Image
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/yjbeetle/sw-runtime
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short,prefix=sha-

      - name: Build Docker Image Locally for Self-Check
        run: |
          echo "[CI] 正在构建 DockerSW 基础镜像..."
          docker build --progress=plain -f docker/Dockerfile -t dockersw:local-test .

      - name: Smoke Test (Wine, Mono COM, Python, pywin32 & CLI)
        run: |
          echo "[CI] 验证 1: 测试固定 Wine 版本与 Windows 虚拟版本..."
          test "$(docker run --rm --entrypoint wine dockersw:local-test --version)" = "wine-11.16"
          docker run --rm dockersw:local-test wine cmd /c ver

          echo "[CI] 验证 2: 测试 Wine-Mono stdcall 与托管 COM 注册组件..."
          docker run --rm dockersw:local-test /usr/local/lib/dockersw/prepare_managed_com.sh

          echo "[CI] 验证 3: 测试 Windows Python 3.11 与 pywin32 COM 模块就绪..."
          docker run --rm dockersw:local-test wine "C:\\Python311\\python.exe" -c "import win32com.client, pythoncom; print('[HEALTH CHECK OK] Windows Python & pywin32 ready')"

          echo "[CI] 验证 4: 运行 dockersw-export 导出工具命令行..."
          docker run --rm dockersw:local-test dockersw-export --help

          echo "[CI] 验证 5: 安装器命令已内置..."
          docker run --rm dockersw:local-test dockersw-install --help

      - name: Push Image to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
